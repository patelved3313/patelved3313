name: Profile assets

on:
  pull_request:
    paths: ['README.md', 'assets/**', 'scripts/**', '.github/workflows/profile.yml']
  push:
    paths: ['README.md', 'assets/**', 'scripts/**', '.github/workflows/profile.yml']
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check activity calculations and failure handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate SVG XML and whitespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('assets').glob('*.svg'):
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              assert root.get('viewBox'), path
          PY
          git diff --check

  refresh:
    needs: verify
    # Scheduled refreshes begin only after this PR is merged. Manual runs on
    # feature branches cannot write to the default branch.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh from the public GitHub calendar
        run: python3 scripts/update_activity.py
      - name: Commit only validated activity graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/activity-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub activity'
            git push
          fi
